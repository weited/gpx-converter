<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert KML and CSV (including Flightradar24 exports) to GPX, entirely in your browser." />
    <title>GPX Converter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M9 23a3 3 0 1 0 0-.01M23 9a3 3 0 1 0 0-.01M9 20V14a4 4 0 0 1 4-4h7M23 12v6a4 4 0 0 1-4 4h-7' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/></svg>" />
    <script>
      // Apply the saved theme before first paint (same logic as lib/theme.ts).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
